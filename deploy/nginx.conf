# Nginx config for MedPrescription
# Serves the built Vue frontend (static) + proxies API/WebSocket to Node (port 3000)
#
# Setup:
#   1. Build frontend:  cd client && npm run build
#   2. Copy client/dist -> /var/www/medprescription
#   3. Put this file in /etc/nginx/sites-available/medprescription
#   4. ln -s /etc/nginx/sites-available/medprescription /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx
#
# For HTTPS: run `certbot --nginx -d yourdomain.com`

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Frontend static files (built Vue app)
    root /var/www/medprescription;
    index index.html;

    # Uploaded files (prescription images)
    location /uploads/ {
        alias /var/www/medprescription/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API — proxy to Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket (Socket.io — chat + WebRTC signaling)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long timeout for live connections
        proxy_send_timeout 3600s;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
